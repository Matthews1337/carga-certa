<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="margin: 0 0 16px; font-size: 22px;">Crie uma senha nova</h2>
  <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5;">
    Recebemos um pedido para trocar a senha da conta {{ .Email }} no Carga Certa. Toque no botão abaixo para criar a senha nova.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 24px; background: #f59e0b; color: #1f2937; font-weight: bold; font-size: 16px; text-decoration: none; border-radius: 8px;">Criar senha nova</a>
  </p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6b7280;">
    O link vence depois de um tempo e só funciona uma vez. Se não foi você que pediu, ignore este e-mail: sua senha continua a mesma.
  </p>
</div>
