            - paragraph [ref=e906]:
              - text: Yes! All Brevo plans give you access to transactional email features, including RESTful APIs, SMTP, outbound webhooks, unlimited log retention, and more. Brevo integrates with all major CMS and our
              - link [ref=e907] [cursor=pointer]:
