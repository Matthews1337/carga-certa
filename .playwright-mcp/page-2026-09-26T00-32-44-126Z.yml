              - heading "Are you committed to this plan?" [level=3] [ref=e910]
            - paragraph [ref=e915]: You choose your commitment period when you sign up for a plan (monthly or yearly). There are no hidden fees with Brevo. Sign up for a plan or purchase credits as you need them, there are no additional fees.
          - listitem [ref=e916]:
            - button [ref=e917] [cursor=pointer]:
              - heading "Why choose a pay-as-you-go plan?" [level=3] [ref=e918]
            - paragraph [ref=e923]: A pay-as-you-go plan is ideal for businesses and organizations that don't send emails often, or that don’t have a large contact list. PAYG credits do not expire, so you can use them at your own pace. One email sent equals one credit deducted. You still get all of our great features and services, however they do not include phone support. It is still possible to easily buy more credits or shift to a monthly plan at anytime though.
          - listitem [ref=e924]:
            - button [ref=e925] [cursor=pointer]:
              - heading "Can I try Brevo before purchasing a plan?" [level=3] [ref=e926]
            - paragraph [ref=e931]: Absolutely! When you create an account, you will automatically have a Free plan to upload your contacts. Once we approve your account for sending, you can start sending up to 300 emails per day.
          - listitem [ref=e932]:
            - button [ref=e933] [cursor=pointer]:
              - heading "What if I change my mind?" [level=3] [ref=e934]
            - paragraph [ref=e939]: If you change your mind, you can cancel your plan at any time directly from your account. Your data will be stored if you wish to use our services again, or we can delete all of your records upon your request.
          - listitem [ref=e940]:
            - button [ref=e941] [cursor=pointer]:
              - heading "How can I pay?" [level=3] [ref=e942]
            - paragraph [ref=e947]: All payments are made by credit card, through our secure payment processor, Adyen, or by Paypal. If you subscribe to a monthly plan, the subscription period is 30 days and charges are processed at the beginning of each period. Email and SMS credits are charged at purchase. All statements are available within your account.
          - listitem [ref=e948]:
            - button [ref=e949] [cursor=pointer]:
              - heading "What is a dedicated IP?" [level=3] [ref=e950]
            - paragraph [ref=e955]: A dedicated IP plan allows you to send email campaigns using your domain name and your own signature. You create transparency with your customers and build a reputation based on your IP and your domain name.
