              - heading "Do I need any prior knowledge or skills?" [level=3] [ref=e893]
            - paragraph [ref=e898]: Not at all! Brevo is designed with simplicity in mind. Even if you're a complete beginner, you'll have all the tools you need to build stunning emails, create contact lists and set advanced preferences. If you ever need guidance, you can take a look at our many tutorials and resources, or contact our support team.
          - listitem [ref=e899]:
