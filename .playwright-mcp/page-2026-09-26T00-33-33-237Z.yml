            - paragraph [ref=f15e62]:
              - text: A plugin is the
              - strong [ref=f15e63]: easiest way to set up Brevo SMTP
              - text: on your website. Our plugins override the default email settings of your website to automatically send your transactional emails over Brevo SMTP. All it takes is a few simple clicks, no coding is required.
            - paragraph [ref=f15e64]:
              - text: Brevo and other apps provide plugins that allow you to route your website’s emails through Brevo SMTP. To find the list of plugins available in Brevo, check our dedicated section
