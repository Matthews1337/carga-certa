<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Controle de gastos de frete para caminhoneiros" />
    <title>Carga Certa</title>
    <script>
      /*
        Aplica o tema antes do primeiro paint. Sem isto, quem usa o tema escuro
        leva um estouro de tela branca a cada carregamento - de madrugada, na
        estrada, isso cega por alguns segundos.

        Repete de proposito a regra de src/tema/tema.ts: aqui nao ha modulo nem
        React ainda. Mexeu la, mexa aqui.
      */
      (function () {
        try {
          var guardado = localStorage.getItem('carga-certa:tema');
          var escuro =
            guardado === 'escuro' ||
            (guardado !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', escuro);
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
